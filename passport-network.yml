version: "3.7"

############################
# NETWORK
############################
networks:
  intranet:

############################
# VOLUMES
############################
#volumes:
#  postgres-data:

############################
# SERVICES
############################

#
# 1. DATABASE (must start first)
#
#postgresd:
#  image: postgres:13
#  ports:
#    - "5432:5432"
#  environment:
#    POSTGRES_USER: postgres
#    POSTGRES_PASSWORD: secret
#  volumes:
#    - postgres-data:/var/lib/postgresql/data
#  networks:
#    - intranet


#
# 2. HYDRA DATABASE MIGRATION
#
services:
  hydra-migrate:
    image: oryd/hydra:v1.11.7
    environment:
      DSN: postgres://hydra:secret@host.docker.internal:5432/hydra?sslmode=disable
      SECRETS_SYSTEM: ${SECRETS_SYSTEM}
    command: migrate -c /etc/config/hydra/hydra.yml sql -e --yes
    volumes:
      - type: bind
        source: ./contrib/hydra
        target: /etc/config/hydra
    restart: on-failure
    networks:
      - intranet


  #
  # 3. KRATOS DATABASE MIGRATION
  #
  kratos-migrate:
    image: oryd/kratos:v0.9.0-alpha.2
    environment:
      DSN: postgres://kratos:secret@host.docker.internal:5432/kratos?sslmode=disable
    command: -c /etc/config/kratos/kratos.yml migrate sql -e --yes
    volumes:
      - type: bind
        source: ./contrib/kratos
        target: /etc/config/kratos
    restart: on-failure
    networks:
      - intranet


  #
  # 4. HYDRA SERVER
  #
  hydra:
    image: oryd/hydra:v1.11.7
    depends_on:
      - hydra-migrate
    ports:
      - "4444:4444" # public
      - "4445:4445" # admin
      - "5555:5555" # Port for token user
    environment:
      DSN: postgres://hydra:secret@host.docker.internal:5432/hydra?sslmode=disable
      SECRETS_SYSTEM: ${SECRETS_SYSTEM}
    command: serve -c /etc/config/hydra/hydra.yml all --dangerous-force-http
    volumes:
      - type: bind
        source: ./contrib/hydra
        target: /etc/config/hydra
    restart: unless-stopped
    networks:
      - intranet


  #
  # 5. KRATOS SERVER
  #
  kratos:
    image: oryd/kratos:v0.9.0-alpha.2
    depends_on:
      - kratos-migrate
    ports:
      - "4433:4433" # public
      - "4434:4434" # admin
    environment:
      DSN: postgres://kratos:secret@host.docker.internal:5432/kratos?sslmode=disable
      LOG_LEVEL: trace
    command: serve -c /etc/config/kratos/kratos.yml --dev --watch-courier
    volumes:
      - type: bind
        source: ./contrib/kratos
        target: /etc/config/kratos
    restart: unless-stopped
    networks:
      - intranet


  #
  # 6. LOGIN / CONSENT UI (Hydra)
  #
  passport-ui-hydra:
    image: oryd/hydra-login-consent-node:v1.11.8
    depends_on:
      - hydra
      - kratos
    environment:
      HYDRA_ADMIN_URL: http://hydra:4445/
      KRATOS_PUBLIC_URL: http://kratos:4433/
      KRATOS_ADMIN_URL: http://kratos:4434/
    ports:
      - "3000:3000"
    restart: unless-stopped
    networks:
      - intranet


  #
  # 7. KRATOS SELF-SERVICE UI
  #
  passport-ui-node:
    image: ga4gh/ga4gh-starter-kit-passport-ui-node:0.0.2
    depends_on:
      - kratos
    environment:
      KRATOS_PUBLIC_URL: http://kratos:4433/
      KRATOS_ADMIN_URL: http://kratos:4434/
      KRATOS_BROWSER_URL: http://127.0.0.1:4433/
      PASSPORT_BROKER_PUBLIC_URL: http://host.docker.internal:4500/ga4gh/passport/v1/
      PASSPORT_BROKER_ADMIN_URL: http://host.docker.internal:4501/admin/ga4gh/passport/v1/
      PORT: 4455
      SECURITY_MODE:
    ports:
      - "4455:4455"
    restart: unless-stopped
    networks:
      - intranet


  #
  # 8. MAIL SERVER (Kratos emails)
  #
  mailslurper:
    image: oryd/mailslurper:latest-smtps
    ports:
      - "4436:4436"
      - "4437:4437"